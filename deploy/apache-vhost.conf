# Apache VirtualHost for Pluma staging, added ALONGSIDE the existing
# marketing app (URL shortener/QR codes, a separate Sail/Laravel stack
# already on this box on host port 8080) - doesn't touch its vhost at all.
# Apache already owns 80/443 on this box, so Pluma doesn't run its own
# proxy; it just gets pinned to fixed internal ports (8090 app / 8091
# Reverb - see deploy/staging.env.example, which also offsets Pluma's own
# Vite/Redis/Postgres ports so they don't collide with the marketing
# stack's) and this vhost forwards to them - same pattern as the Caddy
# site-block (deploy/caddy-site-block.txt) used for the later production
# deployment alongside smarthomecare.
#
# Replace pluma-staging.1hundredbytes.com with the real subdomain. Save as e.g.
# /etc/apache2/sites-available/pluma-staging.conf, then:
#   sudo a2enmod proxy proxy_http proxy_wstunnel ssl headers
#   sudo a2ensite pluma-staging
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#   sudo certbot --apache -d pluma-staging.1hundredbytes.com   # gets TLS, adds
#                                                          # the :443 block
#                                                          # below automatically

<VirtualHost *:80>
    ServerName pluma-staging.1hundredbytes.com
    # certbot will add a redirect to :443 here automatically once run -
    # nothing else needed in this block until then.
</VirtualHost>

<VirtualHost *:443>
    ServerName pluma-staging.1hundredbytes.com

    # SSLEngine/SSLCertificateFile/SSLCertificateKeyFile lines get added
    # here by certbot --apache - don't need to write them by hand.

    # Main app.
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8090/
    ProxyPassReverse / http://127.0.0.1:8090/

    # Reverb (real-time AI chat websocket) - needs mod_proxy_wstunnel for
    # the Upgrade/Connection handshake, and RewriteRule (not ProxyPass)
    # since Apache's websocket proxying is triggered via mod_rewrite's
    # [P] flag rather than a plain ProxyPass directive.
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /app/(.*) ws://127.0.0.1:8091/app/$1 [P,L]
    ProxyPass /app/ http://127.0.0.1:8091/app/
    ProxyPassReverse /app/ http://127.0.0.1:8091/app/
</VirtualHost>
